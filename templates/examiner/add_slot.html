<!DOCTYPE html>
<html>
<head>

    <title>Create Slot</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

</head>

<body>

<div class="container mt-4">

    <h2>Create Examination Slot</h2>

    <form method="POST">

        <div class="mb-3">

            <label class="form-label">
                Examination
            </label>

            <select
                name="examination"
                class="form-control"
                required
            >

                <option value="">
                    Select Examination
                </option>

                {% for exam in examinations %}

                <option value="{{ exam.id }}">
                    {{ exam.name }} - {{ exam.course.name }}
                </option>

                {% endfor %}

            </select>

        </div>


        <div class="mb-3">

            <label class="form-label">
                Date
            </label>

            <input
                type="date"
                name="date"
                class="form-control"
                required
            >

        </div>


        <div class="mb-3">

            <label class="form-label">
                Start Time
            </label>

            <input
                type="time"
                name="start_time"
                class="form-control"
                required
            >

        </div>


        <div class="mb-3">

            <label class="form-label">
                End Time
            </label>

            <input
                type="time"
                name="end_time"
                class="form-control"
                required
            >

        </div>


        <div class="mb-3">

            <label class="form-label">
                Capacity
            </label>

            <input
                type="number"
                name="capacity"
                class="form-control"
                min="1"
                required
            >

        </div>


        <button
            type="submit"
            class="btn btn-success"
        >
            Create Slot
        </button>

        <a
            href="{{ url_for('examiner_dashboard') }}"
            class="btn btn-secondary"
        >
            Back
        </a>

    </form>

</div>

</body>
</html>

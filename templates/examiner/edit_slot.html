<!DOCTYPE html>
<html>

<head>

    <title>Edit Slot</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

</head>

<body>

    <div class="container mt-4">

        <h2>Edit Examination Slot</h2>

        <form method="POST">

            <div class="mb-3">

                <label class="form-label">
                    Examination
                </label>

                <input type="text" class="form-control" value="{{ slot.examination.name }}" disabled>

            </div>


            <div class="mb-3">

                <label class="form-label">
                    Date
                </label>

                <input type="date" name="date" class="form-control" value="{{ slot.date }}" required>

            </div>


            <div class="mb-3">

                <label class="form-label">
                    Start Time
                </label>

                <input type="time" name="start_time" class="form-control"
                    value="{{ slot.start_time.strftime('%H:%M') }}" required>

            </div>


            <div class="mb-3">

                <label class="form-label">
                    End Time
                </label>

                <input type="time" name="end_time" class="form-control" value="{{ slot.end_time.strftime('%H:%M') }}"
                    required>

            </div>


            <div class="mb-3">

                <label class="form-label">
                    Capacity
                </label>

                <input type="number" name="capacity" class="form-control" min="1" value="{{ slot.capacity }}" required>

            </div>


            <button type="submit" class="btn btn-primary">
                Update Slot
            </button>

            <a href="{{ url_for('examiner_dashboard') }}" class="btn btn-secondary">
                Back
            </a>

        </form>

    </div>

</body>

</html>

<!DOCTYPE html>
<html>

<head>

    <title>Evaluate Student</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

</head>

<body>

    <div class="container mt-4">

        <h2 class="mb-4">
            Evaluate Student
        </h2>


        <div class="card">

            <div class="card-body">

                <p>
                    <strong>Student:</strong>
                    {{ booking.student.name }}
                </p>

                <p>
                    <strong>Email:</strong>
                    {{ booking.student.email }}
                </p>

                <p>
                    <strong>Examination:</strong>
                    {{ booking.slot.examination.name }}
                </p>

                <p>
                    <strong>Maximum Marks:</strong>
                    {{ booking.slot.examination.max_marks }}
                </p>


                <form method="POST">

                    <div class="mb-3">

                        <label class="form-label">
                            Marks
                        </label>

                        <input type="number" name="marks" class="form-control" min="0"
                            max="{{ booking.slot.examination.max_marks }}"
                            value="{{ booking.marks if booking.marks is not none else '' }}" required>

                    </div>


                    <div class="mb-3">

                        <label class="form-label">
                            Note
                        </label>

                        <textarea name="note" class="form-control"
                            rows="4">{{ booking.note if booking.note else '' }}</textarea>

                    </div>


                    <button type="submit" class="btn btn-success">
                        Submit Evaluation
                    </button>


                    <a href="{{ url_for('slot_students', id=booking.slot_id) }}" class="btn btn-secondary">
                        Back
                    </a>

                </form>

            </div>

        </div>

    </div>

</body>

</html>

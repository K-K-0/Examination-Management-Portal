<!DOCTYPE html>
<html>

<head>
    <title>Courses</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>

    <div class="container mt-4">

        <h2>Courses</h2>

        <a href="{{ url_for('add_courses') }}" class="btn btn-primary mb-3">
            Add Course
        </a>

        <table class="table table-bordered table-striped">

            <tr>
                <th>ID</th>
                <th>Code</th>
                <th>Name</th>
                <th>Description</th>
                <th>Status</th>
                <th>Action</th>
            </tr>

            {% for course in courses %}
            <tr>

                <td>{{ course.id }}</td>
                <td>{{ course.code }}</td>
                <td>{{ course.name }}</td>
                <td>{{ course.description }}</td>
                <td>{{ course.status }}</td>

                <td>

                    <a href="{{ url_for('edit_course', id=course.id) }}" class="btn btn-warning btn-sm">
                        Edit
                    </a>

                    <a href="{{ url_for('delete_course', id=course.id) }}" class="btn btn-danger btn-sm"
                        onclick="return confirm('Delete this course?')">
                        Delete
                    </a>

                </td>

            </tr>
            {% endfor %}

        </table>

    </div>

</body>

</html>

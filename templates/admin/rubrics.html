<!DOCTYPE html>
<html>
<head>
    <title>Rubrics</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

<div class="container mt-4">

    <h2>Examination Rubrics</h2>

    <a href="{{ url_for('add_rubric') }}" class="btn btn-primary mb-3">
        Add Rubric
    </a>

    <table class="table table-bordered table-hover">

        <thead class="table-dark">
        <tr>
            <th>ID</th>
            <th>Examination</th>
            <th>Criterion</th>
            <th>Max Marks</th>
            <th>Weightage</th>
            <th>Description</th>
            <th>Action</th>
        </tr>
        </thead>

        <tbody>

        {% for rubric in rubrics %}

        <tr>
            <td>{{ rubric.id }}</td>
            <td>{{ rubric.examination.name }}</td>
            <td>{{ rubric.criterion }}</td>
            <td>{{ rubric.max_marks }}</td>
            <td>{{ rubric.weightage }}%</td>
            <td>{{ rubric.description }}</td>

            <td>

                <a href="{{ url_for('edit_rubric', id=rubric.id) }}"
                   class="btn btn-warning btn-sm">

                    Edit

                </a>

                <a href="{{ url_for('delete_rubric', id=rubric.id) }}"
                   class="btn btn-danger btn-sm"
                   onclick="return confirm('Delete this rubric?')">

                    Delete

                </a>

            </td>

        </tr>

        {% endfor %}

        </tbody>

    </table>

</div>

</body>
</html>

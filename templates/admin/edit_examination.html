<!DOCTYPE html>
<html>

<head>

    <title>Edit Examination</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

</head>

<body>

    <div class="container mt-4">

        <h2>Edit Examination</h2>

        <form method="POST">

            <div class="mb-3">

                <label>Course</label>

                <select name="course" class="form-select">

                    {% for course in courses %}

                    <option value="{{ course.id }}" {% if course.id==exam.course_id %}selected{% endif %}>

                        {{ course.name }}

                    </option>

                    {% endfor %}

                </select>

            </div>

            <div class="mb-3">
                <label>Examination Name</label>
                <input type="text" name="name" value="{{ exam.name }}" class="form-control">
            </div>

            <div class="mb-3">

                <label>Examination Type</label>

                <select name="type" class="form-select">

                    <option value="Viva" {% if exam.exam_type=="Viva" %}selected{% endif %}>Viva</option>

                    <option value="Practical" {% if exam.exam_type=="Practical" %}selected{% endif %}>Practical</option>

                    <option value="Project Demo" {% if exam.exam_type=="Project Demo" %}selected{% endif %}>Project Demo
                    </option>

                    <option value="Assessment" {% if exam.exam_type=="Assessment" %}selected{% endif %}>Assessment
                    </option>

                </select>

            </div>

            <div class="mb-3">
                <label>Duration</label>
                <input type="number" name="duration" value="{{ exam.duration }}" class="form-control">
            </div>

            <div class="mb-3">
                <label>Maximum Marks</label>
                <input type="number" name="marks" value="{{ exam.max_marks }}" class="form-control">
            </div>

            <div class="mb-3">
                <label>Slot Creation Start</label>
                <input type="date" name="slot_start" value="{{ exam.slot_creation_start }}" class="form-control">
            </div>

            <div class="mb-3">
                <label>Slot Creation End</label>
                <input type="date" name="slot_end" value="{{ exam.slot_creation_end }}" class="form-control">
            </div>

            <div class="mb-3">
                <label>Booking Start</label>
                <input type="date" name="booking_start" value="{{ exam.booking_start }}" class="form-control">
            </div>

            <div class="mb-3">
                <label>Booking End</label>
                <input type="date" name="booking_end" value="{{ exam.booking_end }}" class="form-control">
            </div>

            <div class="mb-3">

                <label>Status</label>

                <select name="status" class="form-select">

                    <option value="Draft" {% if exam.status=="Draft" %}selected{% endif %}>Draft</option>

                    <option value="Slot Creation" {% if exam.status=="Slot Creation" %}selected{% endif %}>Slot Creation
                    </option>

                    <option value="Booking Open" {% if exam.status=="Booking Open" %}selected{% endif %}>Booking Open
                    </option>

                    <option value="Closed" {% if exam.status=="Closed" %}selected{% endif %}>Closed</option>

                    <option value="Completed" {% if exam.status=="Completed" %}selected{% endif %}>Completed</option>

                </select>

            </div>

            <button class="btn btn-success">
                Update Examination
            </button>

            <a href="{{ url_for('view_examinations') }}" class="btn btn-secondary">

                Back

            </a>

        </form>

    </div>

</body>

</html>

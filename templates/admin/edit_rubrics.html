<!DOCTYPE html>
<html>

<head>

    <title>Edit Rubric</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

</head>

<body>

    <div class="container mt-4">

        <h2>Edit Rubric</h2>

        <form method="POST">

            <div class="mb-3">

                <label>Examination</label>

                <select name="exam" class="form-select">

                    {% for exam in examinations %}

                    <option value="{{ exam.id }}" {% if exam.id==rubric.examination_id %}selected{% endif %}>

                        {{ exam.name }}

                    </option>

                    {% endfor %}

                </select>

            </div>

            <div class="mb-3">
                <label>Criterion Name</label>
                <input type="text" name="criterion" value="{{ rubric.criterion }}" class="form-control" required>
            </div>

            <div class="mb-3">
                <label>Maximum Marks</label>
                <input type="number" name="marks" value="{{ rubric.max_marks }}" class="form-control" required>
            </div>

            <div class="mb-3">
                <label>Weightage (%)</label>
                <input type="number" name="weightage" value="{{ rubric.weightage }}" class="form-control" required>
            </div>

            <div class="mb-3">
                <label>Description</label>

                <textarea name="description" class="form-control">{{ rubric.description }}</textarea>

            </div>

            <button class="btn btn-success">
                Update Rubric
            </button>

            <a href="{{ url_for('view_rubrics') }}" class="btn btn-secondary">
                Back
            </a>

        </form>

    </div>

</body>

</html>

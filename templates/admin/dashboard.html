<!DOCTYPE html>
<html>

<head>

    <title>Admin Dashboard</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

</head>

<body>

    <div class="container mt-4">

        <h2 class="mb-4">
            Admin Dashboard
        </h2>

        <div class="row">

            <div class="col-md-4 mb-3">

                <div class="card">

                    <div class="card-body text-center">

                        <h5>Students</h5>

                        <h2>
                            {{ data.students }}
                        </h2>

                    </div>

                </div>

            </div>


            <div class="col-md-4 mb-3">

                <div class="card">

                    <div class="card-body text-center">

                        <h5>Examiners</h5>

                        <h2>
                            {{ data.examiners }}
                        </h2>

                    </div>

                </div>

            </div>


            <div class="col-md-4 mb-3">

                <div class="card">

                    <div class="card-body text-center">

                        <h5>Courses</h5>

                        <h2>
                            {{ data.courses }}
                        </h2>

                    </div>

                </div>

            </div>


            <div class="col-md-4 mb-3">

                <div class="card">

                    <div class="card-body text-center">

                        <h5>Examinations</h5>

                        <h2>
                            {{ data.examinations }}
                        </h2>

                    </div>

                </div>

            </div>


            <div class="col-md-4 mb-3">

                <div class="card">

                    <div class="card-body text-center">

                        <h5>Slots</h5>

                        <h2>
                            {{ data.slots }}
                        </h2>

                    </div>

                </div>

            </div>


            <div class="col-md-4 mb-3">

                <div class="card">

                    <div class="card-body text-center">

                        <h5>Bookings</h5>

                        <h2>
                            {{ data.bookings }}
                        </h2>

                    </div>

                </div>

            </div>

        </div>


        <hr>


        <h4 class="mt-4 mb-3">
            Management
        </h4>


        <a href="{{ url_for('view_courses') }}" class="btn btn-primary mb-2">
            Courses
        </a>


        <a href="{{ url_for('view_examinations') }}" class="btn btn-primary mb-2">
            Examinations
        </a>


        <a href="{{ url_for('view_rubrics') }}" class="btn btn-primary mb-2">
            Rubrics
        </a>


        <a href="{{ url_for('view_examiners') }}" class="btn btn-primary mb-2">
            Examiners
        </a>


        <a href="{{ url_for('admin_slots') }}" class="btn btn-success mb-2">
            Slots
        </a>


        <a href="{{ url_for('admin_bookings') }}" class="btn btn-success mb-2">
            Bookings
        </a>


        <a href="{{ url_for('admin_search') }}" class="btn btn-secondary mb-2">
            Search
        </a>

    </div>

</body>

</html>

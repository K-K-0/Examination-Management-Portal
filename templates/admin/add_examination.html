<!DOCTYPE html>
<html>

<head>

    <title>Add Examination</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

</head>

<body>

    <div class="container mt-4">

        <h2>Add Examination</h2>

        <form method="POST">

            <div class="mb-3">

                <label>Course</label>

                <select name="course" class="form-select">

                    {% for course in courses %}

                    <option value="{{ course.id }}">
                        {{ course.name }}
                    </option>

                    {% endfor %}

                </select>

            </div>

            <div class="mb-3">
                <label>Examination Name</label>
                <input type="text" name="name" class="form-control" required>
            </div>

            <div class="mb-3">

                <label>Examination Type</label>

                <select name="type" class="form-select">

                    <option>Viva</option>
                    <option>Practical</option>
                    <option>Project Demo</option>
                    <option>Assessment</option>

                </select>

            </div>

            <div class="mb-3">
                <label>Duration (minutes)</label>
                <input type="number" name="duration" class="form-control">
            </div>

            <div class="mb-3">
                <label>Maximum Marks</label>
                <input type="number" name="marks" class="form-control">
            </div>

            <div class="mb-3">
                <label>Slot Creation Start</label>
                <input type="date" name="slot_start" class="form-control">
            </div>

            <div class="mb-3">
                <label>Slot Creation End</label>
                <input type="date" name="slot_end" class="form-control">
            </div>

            <div class="mb-3">
                <label>Booking Start</label>
                <input type="date" name="booking_start" class="form-control">
            </div>

            <div class="mb-3">
                <label>Booking End</label>
                <input type="date" name="booking_end" class="form-control">
            </div>

            <div class="mb-3">

                <label>Status</label>

                <select name="status" class="form-select">

                    <option>Draft</option>
                    <option>Slot Creation</option>
                    <option>Booking Open</option>
                    <option>Closed</option>
                    <option>Completed</option>

                </select>

            </div>

            <button class="btn btn-success">
                Save Examination
            </button>

            <a href="{{ url_for('view_examinations') }}" class="btn btn-secondary">

                Back

            </a>

        </form>

    </div>

</body>

</html>

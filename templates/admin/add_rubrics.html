<!DOCTYPE html>
<html>

<head>

    <title>Add Rubric</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

</head>

<body>

    <div class="container mt-4">

        <h2>Add Rubric</h2>

        <form method="POST">

            <div class="mb-3">

                <label>Examination</label>

                <select name="exam" class="form-select">

                    {% for exam in examinations %}

                    <option value="{{ exam.id }}">
                        {{ exam.name }}
                    </option>

                    {% endfor %}

                </select>

            </div>

            <div class="mb-3">
                <label>Criterion Name</label>
                <input type="text" name="criterion" class="form-control" required>
            </div>

            <div class="mb-3">
                <label>Maximum Marks</label>
                <input type="number" name="marks" class="form-control" required>
            </div>

            <div class="mb-3">
                <label>Weightage (%)</label>
                <input type="number" name="weightage" class="form-control" required>
            </div>

            <div class="mb-3">
                <label>Description</label>
                <textarea name="description" class="form-control"></textarea>
            </div>

            <button class="btn btn-success">
                Save Rubric
            </button>

            <a href="{{ url_for('view_rubrics') }}" class="btn btn-secondary">
                Back
            </a>

        </form>

    </div>

</body>

</html>

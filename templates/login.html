<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Log in</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
  <div class="container min-vh-100 d-flex align-items-center justify-content-center py-4">
    <div class="card shadow-sm w-100" style="max-width: 420px;">
      <div class="card-body p-4">
        <h1 class="h3 mb-1">Log in</h1>
        <p class="text-body-secondary mb-4">Enter your email and password.</p>

        {% with messages = get_flashed_messages() %}
          {% for message in messages %}
            <div class="alert alert-info" role="alert">{{ message }}</div>
          {% endfor %}
        {% endwith %}

        <form method="POST">
          <div class="mb-3">
            <label for="email" class="form-label">Email</label>
            <input type="email" class="form-control" id="email" name="email" autocomplete="email" required>
          </div>

          <div class="mb-3">
            <label for="password" class="form-label">Password</label>
            <input type="password" class="form-control" id="password" name="password" autocomplete="current-password" required>
          </div>

          <button type="submit" class="btn btn-primary w-100">Log in</button>
        </form>

        <p class="text-center text-body-secondary mt-4 mb-0">
          Don't have an account? <a href="{{ url_for('auth.register') }}">Create one</a>
        </p>
      </div>
    </div>
  </div>
</body>
</html>
